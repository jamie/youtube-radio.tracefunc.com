name = "radio-tracefunc-com"
main = "src/index.tsx"
compatibility_date = "2026-08-22"

[observability]
enabled = true

# Sync new playlist videos every 4 hours; sweep watched videos for cleanup once daily.
# The scheduled handler in src/index.tsx dispatches on event.cron to tell these apart.
[triggers]
crons = ["0 */4 * * *", "0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "radio-tracefunc-com"
database_id = "38e319f0-1956-45d0-b745-b59c6424c99b"

# YOUTUBE_API_KEY is a secret, not a var — set it with:
#   wrangler secret put YOUTUBE_API_KEY
# and for local dev, put it in .dev.vars (see .dev.vars.example).
